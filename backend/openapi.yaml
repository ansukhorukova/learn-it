openapi: 3.0.3
info:
  title: Learning Time Tracker API
  version: '1'
  description: >
    API-first backend for Learning Time Tracker. FE never talks to the
    database or file storage directly — every read/write goes through this
    API. Auth: FE signs in via Firebase client SDK (email+password or
    Google); every protected endpoint requires a Firebase ID token in
    `Authorization: Bearer <token>`, verified server-side via Firebase Admin
    SDK.
servers:
  - url: /api/v1

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /users/me:
    get:
      summary: Get (and lazily create) the current user's profile
      description: >
        Verifies the Firebase ID token and upserts a `users` row keyed by
        the Firebase UID if one doesn't exist yet (idempotent — safe to call
        on every sign-in, either provider). Called by the FE immediately
        after any successful sign-in.
      operationId: getCurrentUser
      tags: [users]
      security:
        - firebaseIdToken: []
      parameters:
        - name: locale
          in: query
          required: false
          description: >
            Browser-detected locale (e.g. `en`, `uk`), used only to seed the
            `locale` column when a new user row is created on first sign-in.
            Ignored for an existing user — never overwrites a persisted
            preference.
          schema:
            type: string
      responses:
        '200':
          description: The caller's user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing, malformed, or invalid/expired Firebase ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      summary: Partially update the current user's profile
      description: >
        AUTH-004 `publicName` + AUTH-008 `locale`. Every field is optional —
        OMITTING a field entirely leaves that column unchanged (partial
        update, not a full profile replace). Sending `publicName: null` (or
        an empty/whitespace-only string) explicitly resets it to `null`,
        which is a deliberate, valid action (falls back to `displayName`
        wherever this user is shown to others), not a validation error.
        Sending `locale` persists the FE header language switcher's choice
        (AUTH-008 AC4) — must be one of the registered supported codes
        (currently `en`/`uk`); the two fields update independently of one
        another in the same request.
      operationId: updateCurrentUser
      tags: [users]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: >
            `publicName` longer than 100 characters
            (`errors.profile.publicNameTooLong`), or `locale` outside the
            registered supported codes (`errors.profile.localeInvalid`,
            AUTH-008 AC6) — `users.locale` is left unchanged in that case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/competencies:
    get:
      summary: List the caller's own competencies
      description: >
        AUTH-005/AUTH-006/AUTH-007. Dictionary picks and free-text (custom)
        entries alike, each with its own `willingToTeach` flag. Always scoped
        to the caller (`req.firebaseUser.uid`) — there is no way to list
        another user's competencies through this API.
      operationId: listMyCompetencies
      tags: [profile]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The caller's competencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  competencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserCompetency'
                required: [competencies]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Add a competency to the caller's profile
      description: >
        Exactly one of `competencyId` (a dictionary pick, AUTH-005) or
        `customLabel` (free text, AUTH-006) must be given — both or neither
        is 400 `errors.competency.invalidPayload`.


        **AUTH-005 AC3/AC5**: re-adding a `competencyId` already on the
        caller's profile is 409 `errors.competency.alreadyAdded` (no
        upsert/idempotency here, unlike board_members/task_shares) — an
        unknown or inactive `competencyId` is 400
        (`errors.competency.notFound` / `errors.competency.inactive`
        respectively). A blank/whitespace-only `customLabel` is 400
        `errors.competency.customLabelRequired`; longer than 100 characters is
        `errors.competency.customLabelTooLong`. Duplicate `customLabel`
        values ARE allowed (AUTH-006 AC7) — free text is never deduplicated.
      operationId: addMyCompetency
      tags: [profile]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCompetencyCreateRequest'
      responses:
        '201':
          description: The created competency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompetency'
        '400':
          description: >
            Invalid payload shape, unknown/inactive competencyId, or invalid
            customLabel — see the messageKey table above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This `competencyId` is already on the caller's profile (`errors.competency.alreadyAdded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/competencies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Toggle a competency's "willing to teach" flag
      description: >
        AUTH-007. Works for both dictionary and custom competencies (AC4) —
        the flag doesn't depend on origin.


        **Anti-enumeration (AC3)**: an id belonging to another user's
        `user_competencies` row resolves to the SAME 404
        `errors.competency.notFound` as a genuinely missing id — never 403.
        Same convention already applied to `time_entries` (US-011 AC7) and
        to sign-in (AUTH-002 AC2).
      operationId: updateMyCompetencyWillingToTeach
      tags: [profile]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCompetencyWillingToTeachRequest'
      responses:
        '200':
          description: The updated competency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompetency'
        '400':
          description: '`willingToTeach` missing or not a boolean (`errors.competency.invalidPayload`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such competency on the caller's own profile (see anti-enumeration note above)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Remove a competency from the caller's profile
      description: >
        AUTH-005 AC4 / AUTH-006 AC6 — a single endpoint for both dictionary
        and custom competencies. Removing a competency that has
        `willingToTeach = true` simply removes the row; the flag has no
        existence independent of it. Same anti-enumeration contract as PATCH
        above.
      operationId: removeMyCompetency
      tags: [profile]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such competency on the caller's own profile (see anti-enumeration note above)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/search:
    get:
      summary: Find public profiles willing to teach a competency
      description: >
        US-025 AC1/AC4. Every `users` row with a `user_competencies` row for
        `competencyId` that has `willing_to_teach = true` — literally "ready
        to teach it", not merely "has it listed" (AC1). Each result also
        carries that user's FULL list of `willing_to_teach = true`
        competencies, not just the one searched for (AC4 — useful context).
        Never exposes email, boards, or time data (AC4). No pagination in
        MVP.


        A missing or malformed `competencyId` resolves to an empty result
        list rather than a 400 — the FE is expected not to call this without
        a selection (AC2), but there's no AC-defined error path for a
        malformed one either, and "empty" is indistinguishable in effect
        from AC3's "no matches" empty state.
      operationId: searchUsersByCompetency
      tags: [users]
      security:
        - firebaseIdToken: []
      parameters:
        - name: competencyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching public profiles (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUserSearchResult'
                required: [users]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Firebase UID (not a UUID — `users.id` is the raw Firebase UID)
        schema:
          type: string
    get:
      summary: View another user's public profile
      description: >
        US-026 AC1/AC2. Available for ANY valid `userId`, including the
        caller's own — deliberately NOT gated by shared board/task
        membership (AC1's "доступний для БУДЬ-ЯКОГО валідного userId"), the
        one intentionally wide-open cross-user read in this API. Returns the
        FULL competency list (unlike `/users/search`, which only returns
        willing-to-teach ones) with a per-entry `willingToTeach` flag so the
        FE can render the "Готовий(а) викладати" badge. Never exposes email
        or any other private field.
      operationId: getPublicUserProfile
      tags: [users]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No user with this id (`errors.user.notFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /competencies:
    get:
      summary: The active competencies dictionary
      description: >
        AUTH-005 AC1 — what the profile screen's picker offers. A competency
        retired via `is_active = false` (admin-managed, outside this API)
        simply stops appearing here; any `user_competencies` rows already
        referencing it are unaffected (AUTH-005 AC6).
      operationId: listCompetenciesCatalog
      tags: [profile]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The active dictionary, ordered by slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  competencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competency'
                required: [competencies]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /competencies/{id}/chat/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: A competency's group chat history
      description: >
        US-028 AC2. There is no separate "rooms" resource — a room IS a
        `competencies` row, identified directly by `id`. Any authenticated
        user can read regardless of whether this competency is in their own
        profile or `willing_to_teach` (decision #4 in this project's
        US-025…029 origin notes — no membership concept at all here, unlike
        every other resource in this API). Chronological, oldest first, no
        pagination in MVP. A retired (`is_active = false`) or nonexistent
        competency 404s — deactivation closes the product path but never
        deletes the room's history (AC5).
      operationId: listCompetencyChatMessages
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The room's messages, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompetencyChatMessage'
                required: [messages]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such competency, or it has been retired (`errors.competencyChat.notFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Post a message to a competency's group chat
      description: >
        US-028 AC3/AC4. Same "any authenticated user, no membership check"
        access as GET above. On success, a `competencyChat.message.created`
        WS event (see the "WebSocket channel" section near the end of this
        document) is pushed to every live connection currently subscribed to
        this room — REST remains the source of truth regardless of whether
        any such connection exists.
      operationId: createCompetencyChatMessage
      tags: [chat]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                replyToMessageId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    US-035 — optional quote-reply pointer. Must name a
                    message in THIS same room, else 400
                    `errors.chat.replyTargetInvalid` (AC2-4). Flat reference,
                    not a thread (unlike `task_comments`, US-034).
              required: [body]
      responses:
        '201':
          description: The newly created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyChatMessage'
        '400':
          description: >
            Empty/whitespace-only body (`errors.competencyChat.messageBodyRequired`),
            body over 2000 characters (`errors.competencyChat.messageBodyTooLong`),
            or a `replyToMessageId` not found in this room
            (`errors.chat.replyTargetInvalid`, US-035 AC3/AC4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such competency, or it has been retired (`errors.competencyChat.notFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /competencies/{id}/chat/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Join a competency's group chat
      description: >
        US-031 AC1. Persistent membership (`competency_chat_members`) that
        determines ONLY what `GET /competency-chats/mine` returns for the
        caller — it does NOT gate read/write access to the chat itself,
        which stays "any authenticated user" exactly as in US-028 (AC4).
        Idempotent get-or-create: returns `201` if this call created the
        membership row, `200` if the caller was already a member — same
        contract shape as `POST /dm-threads`. Same 404-for-retired-or-
        missing-room gate as `POST .../chat/messages` — a chat you cannot
        open cannot be joined either.
      operationId: joinCompetencyChat
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: Already a member — no new row created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyChatMembership'
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyChatMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such competency, or it has been retired (`errors.competencyChat.notFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /competencies/{id}/chat/members/me:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Leave a competency's group chat
      description: >
        US-031 AC2/AC3. Hard-deletes the caller's own membership row —
        membership is a current subscription state, not history, so unlike
        `competency_chat_messages` the "never delete" principle used
        elsewhere in this schema does not apply here. Always `204`,
        including when the caller was never a member (idempotent), AND when
        the competency has since been deactivated (`is_active = false`) —
        leaving must stay possible so an archived row can be cleared out of
        `GET /competency-chats/mine` (US-033 AC5). This endpoint has no
        error response of its own.
      operationId: leaveCompetencyChat
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Membership removed, or there was none to begin with
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /languages:
    get:
      summary: The active languages dictionary
      description: >
        US-023 AC1 — what a board's language picker offers, and what `GET
        /boards/public`'s `languageIds` filter matches against. Same
        contract/pattern as `GET /competencies`: a language retired via
        `is_active = false` (admin-managed, outside this API) simply stops
        appearing here; any `board_languages` rows already referencing it
        are unaffected.
      operationId: listLanguagesCatalog
      tags: [boards]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The active dictionary, ordered by slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                required: [languages]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/provider-hint:
    get:
      summary: Which provider an email last signed in with (signup-conflict path only)
      description: >
        Intentionally unauthenticated. Used ONLY by the frontend after
        Firebase's own `createUserWithEmailAndPassword` has already
        rejected a signup attempt with `auth/email-already-in-use` — i.e.
        the email's existence is already disclosed by Firebase before this
        endpoint is ever called. This endpoint adds only "which of the two
        supported providers (password/google.com)", so the frontend can
        show "this email is registered via Google" instead of a generic
        message. Never called from the sign-in path — sign-in keeps
        wrong-password and unknown-email indistinguishable, untouched by
        this endpoint.


        Rate-limited (see backend/src/routes/auth.route.js for the full
        decision writeup): max 10 requests/hour per caller IP AND max 5
        requests/hour per queried email, both independent 1-hour windows.
        Exceeding either returns 429. This bounds the endpoint's use as an
        enumeration oracle without removing the "use Google instead" UX
        entirely.
      operationId: getAuthProviderHint
      tags: [auth]
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Provider hint (null if unknown, e.g. no matching user yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    nullable: true
                    enum: [password, google.com, null]
                required: [provider]
        '400':
          description: Missing/empty `email` query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Per-IP or per-email rate limit exceeded (see description above)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /boards:
    get:
      summary: List the current user's boards
      description: >
        Boards overview (US1). Still scoped strictly to boards owned by the
        caller — a "shared with me" section is explicitly out of scope for
        the US13-US17 pass that added `board_members`/`task_shares`; a
        shared board is reachable directly via `GET /boards/{id}` once its
        id is known (e.g. a link from the sharer), just not listed here yet.
        `taskCount` is computed live via COUNT, never denormalized.
        `totalSeconds`/`thisWeekSeconds` (US12) are the caller's own tracked
        time across every task on the board — all-time and since the current
        calendar week's Monday 00:00 UTC boundary, respectively — computed
        live, never denormalized. `myRole` (US13-US17) is always `owner` on
        this endpoint specifically, since it only ever lists boards the
        caller owns — see `GET /boards/{id}` for a board where it can be
        `collaborator`/`viewer`/`public`.
      operationId: listBoards
      tags: [boards]
      security:
        - firebaseIdToken: []
      parameters:
        - name: categoryId
          in: query
          required: false
          description: >
            US-021 AC9 — narrow "Мої дошки" to boards with this exact
            categoryId. Omitted/empty means no filter. A malformed
            (non-uuid) value matches zero boards rather than erroring.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The caller's boards
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Board'
                required: [boards]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a board
      description: >
        Create board (US2). `ownerId` is always the caller's UID.
        `visibility` always starts `private` no matter what the request body
        contains (US-022's API surface only exposes it on `PATCH`).
      operationId: createBoard
      tags: [boards]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardWriteRequest'
      responses:
        '201':
          description: The newly created board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          description: >
            Empty/too-long title, too-long description, an unknown/inactive
            categoryId (`errors.board.categoryInvalid`/
            `errors.board.categoryInactive`, US-021), or an
            invalid/inactive entry in languageIds
            (`errors.board.languageInvalid`, US-023).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/public:
    get:
      summary: Discover other users' public boards
      description: >
        US-024 — the "Public Boards" section on the boards overview: every
        board with visibility public (US-022) except ones the caller owns
        (those only ever appear in GET /boards, never duplicated here). No
        pagination in this MVP pass. Never includes time_entries or any
        attachment data for any board in the list (US-022 AC12/US-024 AC8)
        — each item carries only fields anyone with an account may see,
        plus the owner's display name (publicName falling back to
        displayName).
      operationId: listPublicBoards
      tags: [boards]
      security:
        - firebaseIdToken: []
      parameters:
        - name: categoryId
          in: query
          required: false
          description: >
            US-021 AC9 — narrow the list to boards with this exact
            categoryId. Omitted/empty means no filter. A malformed
            (non-uuid) value matches zero boards rather than erroring.
          schema:
            type: string
            format: uuid
        - name: languageIds
          in: query
          required: false
          description: >
            US-023 AC8 — narrow the list to boards tagged with ANY of these
            language ids (OR, not AND). Repeat the parameter for multiple
            values. Omitted means no filter; entries that aren't valid
            uuids are dropped, and if that empties an otherwise non-empty
            filter the result is zero boards rather than "no filter
            applied".
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        '200':
          description: Other users' public boards, optionally filtered
          content:
            application/json:
              schema:
                type: object
                properties:
                  boards:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBoard'
                required: [boards]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a single board
      description: >
        Used by the board view header (US5). Since US13-US17, reachable by a
        shared board's collaborator/viewer too, not just the owner — access
        requires ANY effective board-level role (`board_members`, or owner).
        US-022 extends this further: a board with `visibility: 'public'` is
        also readable by any authenticated user with no `board_members` row
        of their own, who gets `myRole: 'public'` (real membership always
        takes priority over this fallback, US-022 AC7). `myRole` on the
        response tells the FE which one so it can gate write UI (e.g. hide
        "add task" for a viewer or public visitor) without a second
        request.
      operationId: getBoard
      tags: [boards]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The board exists but the caller has no board-level access to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Rename / update a board
      description: >
        Rename board (US3), now also the write path for `categoryId`
        (US-021), `visibility` (US-022), and `languageIds` (US-023).
        Owner-only for every field on this endpoint — re-checked
        server-side on every call, distinguishing a non-owner with no board
        access at all (403 `errors.board.forbidden`) from a
        collaborator/viewer/public visitor who has read access but isn't
        the owner (403 `errors.board.ownerOnly`, US15: board settings stays
        owner-only even for a collaborator who can otherwise edit
        tasks/attachments). Every field is independently optional and
        omitted-means-unchanged, EXCEPT `languageIds`, where an explicitly
        empty array (`[]`) is a deliberate "clear every language" (US-023
        AC3/AC4) — the field is simply absent from the body to leave the
        current set untouched.
      operationId: updateBoard
      tags: [boards]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardWriteRequest'
      responses:
        '200':
          description: The updated board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          description: >
            Empty/too-long title, too-long description, an invalid
            `visibility` value (`errors.board.visibilityInvalid`, US-022),
            an unknown/inactive `categoryId`
            (`errors.board.categoryInvalid`/`errors.board.categoryInactive`,
            US-021), or an invalid/inactive entry in `languageIds`
            (`errors.board.languageInvalid`, US-023) — no part of the patch
            is applied when validation fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer/public visitor who isn't the owner
            (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a board
      description: >
        Delete board (US4), irreversible. Cascades to all tasks under it at
        the DB level (`tasks.board_id` is `ON DELETE CASCADE`), which
        transitively cascades `board_members`/`task_shares`/`attachments`
        too (US17: full cascade — deleting a board never leaves orphaned
        membership/share/attachment rows). Owner-only (US15: "collaborator
        НЕ може видалити борд") — same `errors.board.forbidden` vs
        `errors.board.ownerOnly` distinction as `PATCH` above.
      operationId: deleteBoard
      tags: [boards]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer who isn't the owner (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List tasks for a board
      description: >
        Board view (US5) — all tasks across all three status columns. Each
        task's `totalSeconds` (US12 AC4) is the caller's own tracked time on
        it (completed sessions + a running timer's live elapsed time, if
        any). `columnTotals`/`boardTotalSeconds` (US12 AC5) sum that same
        per-task value by column and across the whole board — all computed
        live, never denormalized. Requires board-level access (owner or
        `board_members`) — deliberately does NOT also accept a `task_shares`
        -only grant (US14: listing every task on the board would leak the
        rest of it to someone who was only ever shared one task; they fetch
        that task via `GET /tasks/{id}` instead). Top-level `myRole`
        (US13-US17) is the caller's board-level role; each task's own
        `myRole` is its effective role, which can be MORE permissive than
        the board-level one if that specific task also has a `task_shares`
        row for the caller (see the Task schema's `myRole` note).
      operationId: listBoardTasks
      tags: [tasks]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: Tasks for the board, ordered by status then position
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  columnTotals:
                    type: object
                    description: Sum of `totalSeconds` per status column, for the caller's own time only.
                    properties:
                      planned:
                        type: integer
                      in_progress:
                        type: integer
                      done:
                        type: integer
                    required: [planned, in_progress, done]
                  boardTotalSeconds:
                    type: integer
                    description: Sum of `totalSeconds` across every task on the board, for the caller's own time only.
                  myRole:
                    type: string
                    enum: [owner, collaborator, viewer, public]
                    description: >
                      The caller's board-level effective role (US13-US17,
                      extended by US-022's `public` — see the Board
                      schema's `myRole` for what that means). See each
                      task's own `myRole` for a possible per-task override.
                required: [tasks, columnTotals, boardTotalSeconds, myRole]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board-level access at all (`errors.board.forbidden`), or
            access below `viewer` (`errors.board.readOnlyAccess` — not
            currently reachable since `viewer` is the lowest role, kept for
            forward compatibility).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a task
      description: >
        Create task (US6). Always created with `status: planned`, appended
        to the end of that column — `position` is assigned server-side, not
        accepted from the client on create. Requires board-level
        collaborator+ (US15/US16: a viewer can't create tasks — 403
        `errors.board.readOnlyAccess`; no access at all is 403
        `errors.board.forbidden`). Board-level only, like `GET` above — a
        task doesn't exist yet for a `task_shares` grant to apply to.
      operationId: createTask
      tags: [tasks]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                notes:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: Task description, shown/edited in the task panel.
              required: [title]
      responses:
        '201':
          description: The newly created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Empty/too-long title, or too-long description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a viewer
            (`errors.board.readOnlyAccess`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            Lost a race with another concurrent write to this column's task
            ordering (belt-and-suspenders backstop behind server-side row
            locking — expected to be rare). Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a board's members
      description: >
        board_members CRUD (US13). Owner-only, like every operation under
        this path — a collaborator/viewer gets 403
        `errors.board.ownerOnly` (US15: "collaborator НЕ може керувати
        board_members").
      operationId: listBoardMembers
      tags: [sharing]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The board's members (not including the owner, who is never a row here)
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/BoardMember'
                required: [members]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer who isn't the owner (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Share the board with an email
      description: >
        Add a board member by email, role `viewer` or `collaborator` (US13).
        The email must belong to an already-registered user (looked up
        against `users.email`) — inviting an unregistered email is out of
        scope for this pass; no row is created and the request 404s
        (`errors.share.userNotFound`).


        **US17 duplicate-share decision**: re-sharing with an email that's
        already a member is idempotent, not a 409 — it UPDATES that member's
        role to whatever this request asked for
        (`INSERT ... ON CONFLICT (board_id, user_id) DO UPDATE`), so "change
        someone's role" and "share for the first time" are the same request.


        **US17 self-share**: sharing with the board owner's own email is
        rejected as 400 `errors.share.selfShare` — the owner is never a
        `board_members` row.
      operationId: addBoardMember
      tags: [sharing]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareWriteRequest'
      responses:
        '201':
          description: The created (or, on re-share, updated) member — 201 either way, see the duplicate-share decision above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMember'
        '400':
          description: Invalid email/role, or self-share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer who isn't the owner (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id, or no user is registered with the given email (`errors.share.userNotFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Change a member's role
      description: >
        Owner-only. US17 concurrency: serializes against a concurrent
        DELETE of the same member row via a row lock — if the member was
        just removed by another request, this 404s
        (`errors.share.memberNotFound`) instead of resurrecting it or racing.
      operationId: updateBoardMemberRole
      tags: [sharing]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRoleWriteRequest'
      responses:
        '200':
          description: The updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMember'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer who isn't the owner (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id, or no member with this id on this board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Revoke a member's access
      description: Owner-only. Same concurrency handling as `PATCH` above.
      operationId: removeBoardMember
      tags: [sharing]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No board access at all (`errors.board.forbidden`), or a
            collaborator/viewer who isn't the owner (`errors.board.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No board with this id, or no member with this id on this board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a single task
      description: >
        Task detail (added for US13-US17). The read path a `task_shares`-only
        recipient actually needs: `GET /boards/{id}/tasks` requires
        board-level access (owner or `board_members`), which a caller shared
        only this one task never has — see the Task schema's `myRole` note
        for the effective-role priority rule. Any effective role (viewer or
        above) can read; owner/collaborator/viewer all resolve here the same
        way they do on every other task endpoint.
      operationId: getTask
      tags: [tasks]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task exists but the caller has no board- or task-level access to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Update a task's title and/or status+position
      description: >
        Backs both the drag-and-drop interaction and its accessible fallback
        status control (US8), plus task title edits. `position` is a
        zero-based target index within the destination column (`status`, if
        given, else the task's current column) — an ordering instruction,
        not the raw stored position value (an internal, automatically
        reindexed implementation detail). Access is re-checked server-side
        through the task's effective role on every call (US15/US16): owner
        or collaborator (board- or task-level, whichever is more permissive —
        see the Task schema's `myRole` note) can edit/move; a viewer gets
        403 `errors.task.readOnlyAccess`; a caller with no access at all
        (board or task) gets 403 `errors.task.forbidden`.


        Changing `status`/`position` additionally requires board-level
        access (owner, or a `board_members` row on the parent board) — a
        caller whose only grant is a `task_shares` row on this exact task
        gets 403 `errors.task.reorderRequiresBoardAccess` instead, even at
        `collaborator` rank. Reindexing a column rewrites `position`/
        `updated_at` on every OTHER task currently in the destination
        column, which a task-share-only grant never gives read access to
        (US14) — the title-only edit path is unaffected by this and stays
        available to a task-share-only collaborator.


        **`plannedMinutes` (US-020)**: optional estimated time in minutes,
        same collaborator+ access rule as title/notes (never requires
        board-level access — it never touches the reorder branch). The FE's
        two-field hours/minutes form combines to a single integer before
        sending; `0` or omitting both fields on the FE is sent as `null`
        here, which is a deliberate reset, not an error (AC3) — the field
        disappears from the response, not merely defaults to 0.
      operationId: updateTask
      tags: [tasks]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                notes:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: Task description, shown/edited in the task panel. Same access rule as the title-only edit path — never requires board-level access.
                status:
                  type: string
                  enum: [planned, in_progress, done]
                position:
                  type: integer
                  minimum: 0
                  description: Zero-based target index within the destination column.
                plannedMinutes:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                  description: >
                    Estimated time in minutes (US-020). `null` explicitly
                    resets/clears the estimate (AC3) — omit the field
                    entirely instead to leave it unchanged.
      responses:
        '200':
          description: The updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: >
            Empty/too-long title, too-long description, an invalid status
            value, or an invalid `plannedMinutes` (non-integer/negative —
            `errors.task.plannedMinutesInvalid`; over 9999 —
            `errors.task.plannedMinutesTooLarge`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access at all (`errors.task.forbidden`), a viewer trying to
            edit/move (`errors.task.readOnlyAccess`), or a task-share-only
            collaborator/owner-rank caller trying to change `status`/
            `position` (`errors.task.reorderRequiresBoardAccess`) — see the
            operation description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            Lost a race with another concurrent reorder/drag on the same
            column (belt-and-suspenders backstop behind server-side row
            locking — expected to be rare). Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a task
      description: >
        Delete task (US7), irreversible. Same collaborator+ access rule as
        `PATCH` above (US15: "редагувати" is read broadly enough to cover
        delete — deleting a task isn't withheld from a collaborator the way
        deleting the *board* is).
      operationId: deleteTask
      tags: [tasks]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access at all (`errors.task.forbidden`), or a viewer trying
            to delete (`errors.task.readOnlyAccess`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a task's comments
      description: >
        task_comments (US-019) — chronological (oldest first), no
        pagination this pass (AC8). Unlike `time-entries`, comments are
        SHARED across everyone with task access, not privacy-scoped per
        caller — reuses the same viewer+ `requireTaskRole` gate as
        `GET /tasks/{id}/attachments`/`GET /tasks/{id}/time-entries`: owner,
        collaborator, and viewer (board- or task-level, whichever access
        source is more permissive) all see the identical list.
      operationId: listTaskComments
      tags: [comments]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The task's comments, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskComment'
                required: [comments]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task exists but the caller has no board- or task-level access to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Post a comment on a task
      description: >
        Create a `task_comments` row (US-019 AC2). Owner/collaborator only
        (board- or task-level, whichever is more permissive) — same
        collaborator+ gate as `PATCH /tasks/{id}`: a viewer gets 403
        `errors.task.readOnlyAccess` (AC3), no access at all gets 403
        `errors.task.forbidden` (AC6). No `PATCH`/`DELETE` for a comment
        exists in this pass — view + add only, an explicit MVP scope
        decision (AC10), not an oversight.
      operationId: createTaskComment
      tags: [comments]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                replyToCommentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    US-034 — optional. The exact comment the author clicked
                    "Reply" on. The BE derives `parentCommentId` from it via
                    the flatten-on-level-3 algorithm (US-034 AC1-3): a reply
                    to a level-1 or level-2 comment deepens one level; a
                    reply to a level-3 comment is stored as a SIBLING under
                    the same level-2 parent (no level 4), while
                    `replyToCommentId` still records the exact level-3
                    target. Omitted/null -> a plain top-level comment
                    (`parentCommentId` and `replyToCommentId` both null,
                    unchanged from US-019).
              required: [body]
      responses:
        '201':
          description: The newly created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskComment'
        '400':
          description: >
            Empty/whitespace-only body (`errors.comment.bodyRequired`),
            body over 2000 characters (`errors.comment.bodyTooLong`), or a
            `replyToCommentId` that doesn't exist or belongs to another task
            (`errors.comment.replyTargetInvalid`, US-034 AC7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access to the task at all (`errors.task.forbidden`), or a
            viewer trying to post (`errors.task.readOnlyAccess`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a task's attachments
      description: >
        Attachments (US9), grouped by `kind` on the FE (Files / Links /
        Notes), ordered oldest-first. `kind: 'file'` rows include a freshly
        generated short-lived `downloadUrl` (signed GET URL against the
        S3-compatible bucket, ~15 minutes) — the FE never talks to storage
        directly, it only ever receives this URL from the BE.
      operationId: listTaskAttachments
      tags: [attachments]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The task's attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                required: [attachments]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a file, link, or note attachment
      description: >
        Create attachment (US9). New rows always default to
        `visibility: 'private'` — no visibility picker exists yet
        (sharing is a later pass). `createdBy` is always the caller.


        Two request shapes, both accepted by this one endpoint:
          - `kind: 'link'` / `kind: 'note'` — `application/json` body.
          - `kind: 'file'` — `multipart/form-data` with a `kind=file` field
            and the file itself in a `file` field. The FE never uploads
            straight to storage (CLAUDE.md: "FE ніколи не звертається до
            сховища напряму") — the file bytes are proxied through this
            endpoint, which then does the S3 `PutObject` call server-side.
            Allowed types: common image formats (png/jpeg/gif/webp),
            PDF, Word (.doc/.docx), and plain text. Max size: 25MB.
            SVG is deliberately not allowed (stored-XSS risk: attachment
            chips open via `<a target="_blank">`, which renders SVG as a
            live document rather than an inert image).
      operationId: createTaskAttachment
      tags: [attachments]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentWriteRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [file]
                file:
                  type: string
                  format: binary
              required: [kind, file]
      responses:
        '201':
          description: The newly created attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          description: >
            Invalid `kind`; missing/empty link title or URL; malformed URL;
            missing/empty note body; note body too long; missing file;
            unsupported file MIME type; or file too large (>25MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/attachments/{attachmentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete an attachment
      description: >
        Delete attachment (US9), irreversible. Removes the DB row and, for
        `kind: 'file'`, the corresponding object in the S3-compatible bucket
        — never one without the other, so no orphaned storage object and no
        DB row pointing at a deleted object.
      operationId: deleteTaskAttachment
      tags: [attachments]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id, or no attachment with this id under it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/time-entries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the caller's own time entries for a task, plus totals
      description: >
        Sessions list + timer section (US12 AC1-3). `entries` is the
        caller's own COMPLETED sessions, newest first — the running one, if
        any, is `activeEntry` instead (edited only via the stop endpoint,
        never through the edit/delete session list). `totalSeconds` is the
        sum of completed durations plus the active entry's live elapsed
        time, if running.


        **Contract invariant**: this endpoint NEVER returns another user's
        `time_entries` rows, under any circumstance — `WHERE user_id =
        <caller>` is unconditional in the implementation
        (timeEntries.service.js's listTimeEntriesForTask). A future team-view
        feature that shows other members' time will do so through a
        different, explicitly-aggregate-only endpoint — never by widening
        this one (CLAUDE.md: "Приватність time_entries").
      operationId: listTaskTimeEntries
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The caller's own sessions on this task, plus totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeEntry'
                  activeEntry:
                    allOf:
                      - $ref: '#/components/schemas/TimeEntry'
                    nullable: true
                  totalSeconds:
                    type: integer
                required: [entries, activeEntry, totalSeconds]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Add a manual (already-completed) time entry
      description: >
        Manual entry / correction (US11 AC1-4). Creates a COMPLETED session:
        `endedAt = now()`, `startedAt = endedAt - minutes*60s`,
        `durationSeconds = minutes*60`. Never touches the active-timer state
        — use the `/start`/`/stop` endpoints for that.
      operationId: createTaskTimeEntry
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryWriteRequest'
      responses:
        '201':
          description: The newly created (completed) entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '400':
          description: >
            `minutes` missing/zero/negative/non-integer
            (errors.timeEntry.minutesInvalid); `minutes` > 1440
            (errors.timeEntry.minutesTooLarge); `note` longer than 500
            characters (errors.timeEntry.noteTooLong).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/time-entries/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Start the timer on this task
      description: >
        Start timer (US10 AC1-2). Product decision: **auto-stop-and-switch**
        — if the caller already has an active timer running on ANY task
        (this app allows only one active timer per user, not per task), it
        is auto-stopped (`endedAt = now()`, `durationSeconds` computed) in
        the same transaction as the new start, and returned as
        `autoStoppedEntry` so the FE can show a "switched timers" notice.
        `autoStoppedEntry` is `null` when there was no active timer to stop.
      operationId: startTaskTimer
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      responses:
        '201':
          description: The newly started entry, plus the auto-stopped one if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  startedEntry:
                    $ref: '#/components/schemas/TimeEntry'
                  autoStoppedEntry:
                    allOf:
                      - $ref: '#/components/schemas/TimeEntry'
                    nullable: true
                required: [startedEntry, autoStoppedEntry]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            Extremely unlikely: exhausted retries against repeated
            concurrent starts from the same user (errors.timeEntry.startConflict).
            Safe to retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/time-entries/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Stop the caller's active timer on this task
      description: >
        Stop timer (US10 AC4-5). `endedAt = now()`, `durationSeconds`
        computed from `startedAt`. An optional `note` is stored on the
        stopped entry.
      operationId: stopTaskTimer
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: The stopped entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '400':
          description: '`note` longer than 500 characters (errors.timeEntry.noteTooLong)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            No timer is currently running on this task
            (errors.timeEntry.noActiveTimer) — including a race where it was
            just stopped by another concurrent request. Not retryable as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/time-entries/{entryId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Edit a completed time entry's minutes and/or note
      description: >
        Edit / correct a session (US11 AC5-7). `startedAt` never changes —
        only `durationSeconds` and `endedAt` (recomputed as `startedAt +
        durationSeconds`) when `minutes` is given. Only ever the caller's own
        COMPLETED entries: an entry that's still active (`endedAt IS NULL`
        — edit it via the stop endpoint instead) or belongs to another user
        both resolve to the same 404 as a nonexistent id, never 403 — an
        anti-enumeration guarantee for time-tracking privacy (CLAUDE.md
        "Приватність time_entries"), matching how boards/tasks otherwise use
        403 for "exists but not yours".
      operationId: updateTaskTimeEntry
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryWriteRequest'
      responses:
        '200':
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
        '400':
          description: >
            `minutes` present but zero/negative/non-integer
            (errors.timeEntry.minutesInvalid); `minutes` > 1440
            (errors.timeEntry.minutesTooLarge); `note` longer than 500
            characters (errors.timeEntry.noteTooLong).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >
            No task with this id; no entry with this id under it; the entry
            is still active; or the entry belongs to another user
            (errors.timeEntry.notFound — see description above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a time entry
      description: >
        Delete a session (US11 AC8), active or completed — deleting an
        active one cancels the timer with nothing saved, no separate
        "cancel" endpoint. Same anti-enumeration 404 contract as the PATCH
        above (never 403 for another user's entry).
      operationId: deleteTaskTimeEntry
      tags: [time-entries]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The task's board belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id; no entry with this id under it; or the entry belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/shares:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a task's shares
      description: >
        task_shares CRUD (US14) — sharing ONE task by email, WITHOUT
        granting access to the rest of its board. Owner-of-the-PARENT-BOARD
        -only, like every operation under this path — even a collaborator
        with full edit rights on this exact task gets 403
        `errors.task.ownerOnly` (US15: "collaborator НЕ може керувати
        task_shares").
      operationId: listTaskShares
      tags: [sharing]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The task's shares
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskShare'
                required: [shares]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access to the task at all (`errors.task.forbidden`), or
            access that isn't the parent board's owner (`errors.task.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Share the task with an email
      description: >
        Add a task share by email, role `viewer` or `collaborator` (US14).
        Same email-must-be-a-registered-user, idempotent-duplicate-share, and
        self-share rules as `POST /boards/{id}/members` — see that
        operation's description; the only difference is scope (this task
        only, never the board) and who's authorized (the board owner, not a
        collaborator on this task).
      operationId: addTaskShare
      tags: [sharing]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareWriteRequest'
      responses:
        '201':
          description: The created (or, on re-share, updated) share — 201 either way
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskShare'
        '400':
          description: Invalid email/role, or self-share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access to the task at all (`errors.task.forbidden`), or
            access that isn't the parent board's owner (`errors.task.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id, or no user is registered with the given email (`errors.share.userNotFound`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{id}/shares/{shareId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: shareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Change a share's role
      description: >
        Owner-of-the-parent-board-only. US17 concurrency: same row-locked
        serialization against a concurrent DELETE of the same share as
        `PATCH /boards/{id}/members/{memberId}` — see its description.
      operationId: updateTaskShareRole
      tags: [sharing]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRoleWriteRequest'
      responses:
        '200':
          description: The updated share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskShare'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access to the task at all (`errors.task.forbidden`), or
            access that isn't the parent board's owner (`errors.task.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id, or no share with this id on this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Revoke a share
      description: >
        Owner-of-the-parent-board-only. Note this is independent of
        `board_members` — revoking a task share never affects that user's
        board-level role, if they have one (US17 priority rule works in
        both directions: it picks the more permissive of the two while both
        exist, but removing one leaves the other, if any, untouched).
      operationId: removeTaskShare
      tags: [sharing]
      security:
        - firebaseIdToken: []
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            No access to the task at all (`errors.task.forbidden`), or
            access that isn't the parent board's owner (`errors.task.ownerOnly`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No task with this id, or no share with this id on this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /dm-threads:
    post:
      summary: Get-or-create a DM thread with another user about one competency
      description: >
        US-027 AC1-3. A top-level resource, not nested under `/users` — a
        thread belongs to a PAIR of users plus a competency, with no single
        natural parent to nest it under (the group chat under
        `/competencies/{id}/chat` does have one, hence the different
        nesting there).


        Idempotent get-or-create: the SAME (caller, `targetUserId`,
        `competencyId`) always resolves to the SAME thread — uniqueness is
        enforced at the DB level on the normalized pair, so this is safe
        under concurrent calls (AC1). Returns `200` if the thread already
        existed, `201` if this call just created it — same JSON shape
        either way.


        `competencyId` must be one `targetUserId` has marked
        `willing_to_teach = true` for (determined by US-026 AC3-5's profile
        flow) — re-validated server-side on every call, including a direct
        API call that tries to bypass that UI selection (AC3).
      operationId: getOrCreateDmThread
      tags: [chat]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: string
                  description: Firebase UID of the person to message
                competencyId:
                  type: string
                  format: uuid
              required: [targetUserId, competencyId]
      responses:
        '200':
          description: The existing thread for this pair+competency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmThread'
        '201':
          description: A newly created thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmThread'
        '400':
          description: >
            `targetUserId` equal to the caller (`errors.dmThread.cannotMessageSelf`),
            or `competencyId` not marked `willing_to_teach = true` by
            `targetUserId` — including a nonexistent/malformed id, which is
            indistinguishable from "not offered" (`errors.dmThread.competencyNotOffered`),
            or a missing/malformed `targetUserId` (`errors.dmThread.invalidPayload`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: List my DM threads
      description: >
        US-027 AC11/AC12. Every thread the caller participates in, sorted by
        last activity (most recent message, or the thread's own
        `createdAt` if it has no messages yet, AC12) descending. No
        pagination in MVP.
      operationId: listMyDmThreads
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The caller's threads, most recently active first
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      $ref: '#/components/schemas/DmThread'
                required: [threads]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /dm-threads/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: A DM thread's message history
      description: >
        US-027 AC4/AC5. Participants only — DM privacy is absolute, there is
        no owner/admin exception anywhere in this project for someone else's
        private messages. A nonexistent thread id and "thread exists but I'm
        not a participant" are BOTH `403 errors.dmThread.forbidden` — never a
        distinct 404 — so a thread id alone never reveals whether it names a
        real conversation between two other people (same anti-enumeration
        principle the WS `subscribe` frame's authorization check applies,
        see the "WebSocket channel" section near the end of this document).
        Chronological, oldest first, no pagination in MVP.
      operationId: listDmThreadMessages
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The thread's messages, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/DmMessage'
                required: [messages]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a participant of this thread, or the thread doesn't exist (`errors.dmThread.forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Send a message in a DM thread
      description: >
        US-027 AC5-8. Same participants-only gate as GET above. On success,
        a `dm.message.created` WS event (see the "WebSocket channel" section
        near the end of this document) is pushed to the other participant's
        live connection(s), if any, AND to any connection subscribed to this
        specific thread's channel — REST remains the source of truth
        regardless of whether any such connection exists (AC8: a missing/
        dropped WS connection never loses the message).
      operationId: createDmThreadMessage
      tags: [chat]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                replyToMessageId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    US-035 — optional quote-reply pointer. Must name a
                    message in THIS same thread, else 400
                    `errors.chat.replyTargetInvalid` (AC1/AC3/AC4). Replying
                    to your own message is allowed (AC9).
              required: [body]
      responses:
        '201':
          description: The newly created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmMessage'
        '400':
          description: >
            Empty/whitespace-only body (`errors.dmThread.messageBodyRequired`),
            body over 2000 characters (`errors.dmThread.messageBodyTooLong`),
            or a `replyToMessageId` not found in this thread
            (`errors.chat.replyTargetInvalid`, US-035 AC3/AC4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a participant of this thread, or the thread doesn't exist (`errors.dmThread.forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /competency-chats/mine:
    get:
      summary: List my joined competency chats
      description: >
        US-031 AC5. A top-level resource, not nested under `/competencies`
        or `/users` — a per-user VIEW over `competency_chat_members`, same
        "no single natural parent" reasoning as `/dm-threads`. Every
        competency chat the caller has explicitly joined (US-031 AC1) —
        NEVER auto-populated from `user_competencies`/`willing_to_teach`
        (AC6) — sorted by last activity (most recent message, or `joinedAt`
        if the chat has no messages yet) descending, same pattern as `GET
        /dm-threads` (US-027 AC11/AC12). A chat whose competency has since
        been deactivated (`is_active = false`) still appears, with
        `competencyActive: false` (AC7) — the FE renders it as an
        archived/disabled row (US-033 AC5) instead of a clickable chat.
      operationId: listMyCompetencyChats
      tags: [chat]
      security:
        - firebaseIdToken: []
      responses:
        '200':
          description: The caller's joined chats, most recently active first
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompetencyChatSummary'
                required: [chats]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /chat/forwards:
    post:
      summary: Forward a message into another chat
      description: >
        US-036. Copies an existing message's body into a NEW message in a
        destination chat (DM thread or competency room), under the
        forwarder's own `senderId`. A top-level action resource — neither
        the source nor the destination has a single natural parent to nest
        it under.

        The one rule this endpoint enforces: a forward is allowed ONLY when
        `sourceMessageId` currently lives in `competency_chat_messages`. The
        check is by TABLE LOOKUP, never by any historical/inherited field —
        so a message that was itself forwarded from a competency chat INTO a
        DM thread (now a real `dm_messages` row) cannot be forwarded further
        (AC7, transitive). Source in `dm_messages` -> 403
        `errors.chat.forwardFromDmForbidden`, unconditionally, even for a
        participant of that thread (AC2). Source in neither table -> 404
        `errors.chat.messageNotFound` (AC3).

        Destination authorization reuses the EXACT SAME gate a normal
        `POST /dm-threads/{id}/messages` (AC4) / `POST
        /competencies/{id}/chat/messages` (AC5) uses — for a competency
        destination that means "active room, membership NOT required"
        (US-031 AC4). The new message carries `forwardedFrom` (the source
        room's competency) for the FE's "Forwarded from {competency} chat"
        attribution; the original author is never exposed. The same
        `dm.message.created`/`competencyChat.message.created` WS push as a
        normal send is emitted for the destination.
      operationId: createChatForward
      tags: [chat]
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceMessageId:
                  type: string
                  format: uuid
                  description: The message to forward. Must currently be a `competency_chat_messages` row.
                destinationType:
                  type: string
                  enum: [dmThread, competencyChat]
                destinationId:
                  type: string
                  format: uuid
                  description: >
                    A DM thread id (`destinationType: dmThread`) or a
                    competency id (`destinationType: competencyChat`).
              required: [sourceMessageId, destinationType, destinationId]
      responses:
        '201':
          description: >
            The newly created message in the destination chat — a
            `DmMessage` or `CompetencyChatMessage` depending on
            `destinationType`, with `forwardedFrom` populated.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DmMessage'
                  - $ref: '#/components/schemas/CompetencyChatMessage'
        '400':
          description: >
            `destinationType` is neither `dmThread` nor `competencyChat`
            (`errors.chat.invalidDestinationType`) — a conforming client
            never sends this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Source message is a DM message (`errors.chat.forwardFromDmForbidden`,
            AC2/AC7), or the caller isn't a participant of the destination DM
            thread (`errors.dmThread.forbidden`, AC4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >
            Source message exists in neither message table
            (`errors.chat.messageNotFound`, AC3), or the destination
            competency room is nonexistent/retired
            (`errors.competencyChat.notFound`, AC5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    Unauthorized:
      description: Missing, malformed, or invalid/expired Firebase ID token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token, verified via Firebase Admin SDK.

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: Firebase UID
        email:
          type: string
          format: email
        displayName:
          type: string
          description: System-generated, never user-editable (see the users table comment in CLAUDE.md "Дані").
        publicName:
          type: string
          nullable: true
          description: >
            AUTH-004 — user-editable name shown to other users in shared
            contexts (board_members/task_shares listings) INSTEAD OF
            displayName, when set. Null falls back to displayName wherever
            this user is shown to someone else.
        locale:
          type: string
          example: en
        createdAt:
          type: string
          format: date-time
      required: [id, email, displayName, publicName, locale, createdAt]

    UserProfileUpdateRequest:
      type: object
      description: >
        Partial update — every field is optional; an OMITTED field is left
        unchanged (AUTH-004 AC8, AUTH-008 AC4). Recognizes `publicName` and
        `locale`, updated independently of one another.
      properties:
        publicName:
          type: string
          nullable: true
          maxLength: 100
          description: >
            An explicit `null` (or an empty/whitespace-only string) resets to
            the displayName fallback (AC3) — not a validation error. Over 100
            characters (after trim) is 400 `errors.profile.publicNameTooLong`.
        locale:
          type: string
          description: >
            AUTH-008 — the FE header language switcher's active locale.
            Must be one of the registered supported codes (currently
            `en`/`uk`); any other value is 400
            `errors.profile.localeInvalid` and leaves `users.locale`
            unchanged.
          example: uk

    Competency:
      type: object
      description: One entry in the active competencies dictionary (AUTH-005).
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Locale lookup key — rendered via `competency.<slug>` in the FE's own dictionary, never returned pre-translated.
      required: [id, slug]

    UserCompetency:
      type: object
      description: >
        One of the caller's own competencies — either a dictionary pick
        (`isCustom = false`, `competencyId`/`competencySlug` set) or a
        free-text entry (`isCustom = true`, `customLabel` set). Exactly one
        of `competencySlug`/`customLabel` is non-null on any given row.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          description: Firebase UID — always the caller for any row this API ever returns.
        competencyId:
          type: string
          format: uuid
          nullable: true
        competencySlug:
          type: string
          nullable: true
          description: Set only when isCustom is false — render via `competency.<slug>`, same as Competency.slug above.
        isCustom:
          type: boolean
        customLabel:
          type: string
          nullable: true
          description: Set only when isCustom is true. User-generated text — rendered as-is, never run through the locale dictionary.
        willingToTeach:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, competencyId, competencySlug, isCustom, customLabel, willingToTeach, createdAt, updatedAt]

    UserCompetencyCreateRequest:
      type: object
      description: Exactly one of `competencyId`/`customLabel` — see POST /users/me/competencies for the full validation rules.
      properties:
        competencyId:
          type: string
          format: uuid
        customLabel:
          type: string
          maxLength: 100

    UserCompetencyWillingToTeachRequest:
      type: object
      properties:
        willingToTeach:
          type: boolean
      required: [willingToTeach]

    Board:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        accent:
          type: string
          enum: [teal, rose, violet, sky, moss, clay]
        ownerId:
          type: string
          description: Firebase UID of the owner
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: >
            US-021 — optional board category, an id from the shared
            `competencies` dictionary (`GET /competencies`, AUTH-005) rather
            than a separate catalog. `null` means "Без категорії"/no
            category. The FE resolves the display label itself via
            `competency.<slug>`, matching the already-fetched competencies
            dictionary against this id — this response never carries a slug
            directly.
        languages:
          type: array
          description: >
            US-023 — the board's tagged learning-material languages, each
            an id/slug pair from the `languages` dictionary (`GET
            /languages`). Empty array when the board has no language tags.
          items:
            $ref: '#/components/schemas/Language'
        visibility:
          type: string
          enum: [private, public]
          description: >
            US-022 — `private` (default) restricts read access to the
            owner and any `board_members`/`task_shares` grant, exactly like
            before this feature existed. `public` additionally grants
            read-only access to any authenticated user with none of those
            (`myRole: 'public'` in their response) — it never changes any
            mutation endpoint's authorization.
        taskCount:
          type: integer
        myRole:
          type: string
          enum: [owner, collaborator, viewer, public]
          description: >
            The caller's effective role on this board (US13-US17, extended
            by US-022): `owner` (boards.owner_id), their `board_members`
            role, or — only when neither applies AND the board is
            `visibility: 'public'` — `public` (US-022 AC2/AC7: a real
            membership role always wins over this fallback). Always `owner`
            on `GET /boards` (list is scoped to boards the caller owns);
            can be `collaborator`/`viewer`/`public` on `GET /boards/{id}`.
        totalSeconds:
          type: integer
          description: >
            Caller's own all-time tracked time across every task on this
            board (US12 AC6). Computed live, never denormalized. For a
            `myRole: 'public'` caller this is their own (typically zero)
            time, never another user's — US-022 AC5, time_entries privacy
            is unconditional.
        thisWeekSeconds:
          type: integer
          description: >
            Caller's own tracked time on this board since the current
            calendar week's Monday 00:00 UTC boundary (US12 AC6).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, description, accent, ownerId, categoryId, languages, visibility, taskCount, myRole, totalSeconds, thisWeekSeconds, createdAt, updatedAt]

    PublicBoard:
      type: object
      description: >
        One item in `GET /boards/public` (US-024) — deliberately a SEPARATE,
        narrower shape from `Board`, not a reuse of it: it adds `ownerName`
        (who owns this board — always relevant for a board that isn't the
        caller's own) and permanently omits `totalSeconds`/`thisWeekSeconds`
        (US-022 AC12/US-024 AC8 — this list must never carry another user's
        time-tracking data, not even in aggregate; `Board`'s schema requires
        those fields, which is exactly why this isn't `Board`). `myRole` is
        always `public` here (US-024 AC2 excludes the caller's own boards
        from this list entirely, so there's no owner/collaborator/viewer
        case to represent).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        accent:
          type: string
          enum: [teal, rose, violet, sky, moss, clay]
        ownerId:
          type: string
          description: Firebase UID of the owner
        ownerName:
          type: string
          description: >
            The owner's `publicName` if set, else their `displayName`
            (US-024 AC8, same fallback resolution used throughout this API
            wherever one user is shown to another).
        categoryId:
          type: string
          format: uuid
          nullable: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        visibility:
          type: string
          enum: [public]
          description: Always `public` — this endpoint only ever lists public boards.
        taskCount:
          type: integer
        myRole:
          type: string
          enum: [public]
          description: Always `public` — see the schema description above.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, description, accent, ownerId, ownerName, categoryId, languages, visibility, taskCount, myRole, createdAt, updatedAt]

    BoardWriteRequest:
      type: object
      description: >
        Used by both `POST /boards` and `PATCH /boards/{id}`. Every field is
        independently optional and omitted-means-unchanged on `PATCH`
        (`POST` instead treats an omitted field as its natural default — no
        category, no languages, `private` visibility). `visibility` is
        accepted by this schema but only ever honored on `PATCH` — see `POST
        /boards`'s own description.
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 2000
        accent:
          type: string
          enum: [teal, rose, violet, sky, moss, clay]
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: >
            US-021 — an id from `GET /competencies`, or `null` to
            explicitly clear the category. Must be `is_active: true` at the
            time it's assigned (400 `errors.board.categoryInactive`
            otherwise) — an already-assigned category that's later
            deactivated is left alone, not re-validated.
        visibility:
          type: string
          enum: [private, public]
          description: US-022 — `PATCH` only, owner-only. See `PATCH /boards/{id}`'s description.
        languageIds:
          type: array
          description: >
            US-023 — full-replace, not diff/append: every id in this array
            becomes the board's entire language set, replacing whatever was
            there before. Omit the field to leave the current set
            untouched; pass `[]` to explicitly clear it. Every id must
            exist and be `is_active: true` (400
            `errors.board.languageInvalid` otherwise, all-or-nothing — no
            id is applied if any one is invalid).
          items:
            type: string
            format: uuid

    Language:
      type: object
      description: One entry in the active languages dictionary (US-023), same shape/contract as Competency.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Locale lookup key — rendered via `language.<slug>` in the FE's own dictionary, never returned pre-translated.
      required: [id, slug]

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        title:
          type: string
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [planned, in_progress, done]
        position:
          type: integer
          description: Internal, automatically reindexed ordering value — not meaningful across columns.
        createdBy:
          type: string
          description: Firebase UID of the creator
        attachmentCount:
          type: integer
          description: >
            Live count of this task's attachments (US9) — computed via
            COUNT, never denormalized. Rendered as a badge on the task card.
        myRole:
          type: string
          enum: [owner, collaborator, viewer, public]
          description: >
            The caller's EFFECTIVE role on this task (US13-US17, extended
            by US-022): `owner` (the parent board's owner_id), else the
            MORE PERMISSIVE of any `board_members` role on the task's
            parent board and any `task_shares` role for this exact task —
            e.g. a board-level `viewer` who was additionally task-shared as
            `collaborator` on this one task sees `collaborator` here (and
            `viewer` on every other task on the board). A `task_shares` row
            never widens access to the board itself or to any other task.
            `public` (US-022) applies only when NEITHER of those real
            sources grants any access at all and the parent board is
            `visibility: 'public'` — a real role, however small, always
            wins over this fallback (US-022 AC7).
        totalSeconds:
          type: integer
          description: >
            Caller's own tracked time on this task (US12 AC4): completed
            sessions' durations plus a running timer's live elapsed time, if
            any. Computed live, never denormalized. Rendered as a badge on
            the task card, hidden when 0.
        plannedMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 9999
          description: >
            Optional estimated time in minutes (US-020), set via `PATCH
            /tasks/{id}`. `null` when no estimate has been set — the FE
            shows no estimate placeholder in that case (AC6). Shown
            alongside `totalSeconds` as a simple "estimated / logged"
            comparison — no progress bar or over/under indicator (AC7,
            explicit scope decision).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, boardId, title, notes, status, position, createdBy, attachmentCount, myRole, totalSeconds, plannedMinutes, createdAt, updatedAt]

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [file, link, note]
        title:
          type: string
          nullable: true
          description: File original filename (kind file) or link title (kind link). Null for notes.
        url:
          type: string
          nullable: true
          description: Link target URL (kind link only).
        mimeType:
          type: string
          nullable: true
          description: Uploaded file's MIME type (kind file only).
        body:
          type: string
          nullable: true
          description: Note text (kind note only).
        downloadUrl:
          type: string
          nullable: true
          description: >
            Short-lived signed GET URL (kind file only) — present only when
            the row is kind file, absent for link/note. Regenerated on every
            list/create call, never persisted.
        isImage:
          type: boolean
          description: >
            True when mimeType is an image/* type (kind file only) — tells
            the FE to render a thumbnail preview instead of a generic file
            chip.
        visibility:
          type: string
          enum: [private, shared, selected]
          description: >
            Always 'private' this pass — no visibility picker UI exists yet
            (sharing is a later feature). The full enum range already exists
            in the schema so that pass won't need a migration.
        createdBy:
          type: string
          description: Firebase UID of the creator
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, taskId, kind, visibility, createdBy, createdAt, updatedAt]

    AttachmentWriteRequest:
      type: object
      description: Used for kind 'link' and kind 'note' (application/json). See the multipart schema on POST /tasks/{id}/attachments for kind 'file'.
      properties:
        kind:
          type: string
          enum: [link, note]
        title:
          type: string
          maxLength: 200
          description: Required for kind 'link'.
        url:
          type: string
          maxLength: 2000
          description: Required for kind 'link'. Must be a valid http(s) URL.
        body:
          type: string
          maxLength: 2000
          description: Required for kind 'note'.
      required: [kind]

    TimeEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        userId:
          type: string
          description: Firebase UID of the entry's owner — always the caller for any entry this API ever returns.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the timer is running (US10) — a completed entry always has this set.
        durationSeconds:
          type: integer
          nullable: true
          description: Null while the timer is running. Set together with endedAt once stopped.
        note:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, taskId, userId, startedAt, endedAt, durationSeconds, note, createdAt, updatedAt]

    TimeEntryWriteRequest:
      type: object
      description: >
        Used by both POST (create, `minutes` required) and PATCH (edit, both
        fields optional — omit a field to leave it unchanged).
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Whole minutes, 1-1440 (24h). See errors.timeEntry.minutesInvalid/minutesTooLarge.
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional. On PATCH, an explicit null clears an existing note.

    BoardMember:
      type: object
      description: A board_members row (US13) — a non-owner's granted access to a whole board.
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        userId:
          type: string
          description: Firebase UID of the member (resolved server-side from the email given at share time).
        email:
          type: string
          format: email
        displayName:
          type: string
          description: >
            AUTH-004 AC5/AC6 — this member's publicName if they've set one,
            else their system displayName. Already resolved server-side; the
            raw displayName is never separately exposed here.
        role:
          type: string
          enum: [viewer, collaborator]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, boardId, userId, email, displayName, role, createdAt, updatedAt]

    TaskShare:
      type: object
      description: A task_shares row (US14) — a non-owner's granted access to ONE task, independent of board_members.
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        userId:
          type: string
          description: Firebase UID of the recipient (resolved server-side from the email given at share time).
        email:
          type: string
          format: email
        displayName:
          type: string
          description: >
            AUTH-004 AC5/AC6 — this recipient's publicName if they've set
            one, else their system displayName. Already resolved
            server-side; the raw displayName is never separately exposed
            here.
        role:
          type: string
          enum: [viewer, collaborator]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, taskId, userId, email, displayName, role, createdAt, updatedAt]

    TaskComment:
      type: object
      description: >
        A `task_comments` row (US-019/US-034) — SHARED across everyone with
        access to the task (owner/collaborator/viewer), on the same footing
        as `tasks.status`, unlike the privacy-scoped `time_entries`. View +
        add only this pass — no `updatedAt` (nothing ever mutates a row
        after insert, since there's no edit endpoint).
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorId:
          type: string
          description: Firebase UID of the comment's author.
        authorName:
          type: string
          description: >
            AUTH-004 AC5/AC6 — the author's publicName if they've set one,
            else their system displayName. Already resolved server-side;
            the raw displayName is never separately exposed here.
        body:
          type: string
          maxLength: 2000
        parentCommentId:
          type: string
          format: uuid
          nullable: true
          description: >
            US-034 — the REAL tree edge (max depth 3, enforced by the
            flatten algorithm below, not a DB constraint). `null` for a
            top-level comment. The FE builds the visual nesting/grouping
            EXCLUSIVELY from this field's parent chain — never from
            `replyToCommentId`.
        replyToCommentId:
          type: string
          format: uuid
          nullable: true
          description: >
            US-034 AC1-3 — the exact comment the author clicked "Reply" on;
            used ONLY to render the "In reply to {author}: «{excerpt}»"
            quote preview. Equals `parentCommentId` for a normal one-level
            deepening (reply to a level-1 or level-2 comment), but can point
            DEEPER than `parentCommentId` when the target was already
            level 3: replying to a level-3 comment flattens the new comment
            into a SIBLING under the same level-2 `parentCommentId` (no
            level 4 is ever created), while `replyToCommentId` still names
            the exact level-3 comment that was replied to.
        createdAt:
          type: string
          format: date-time
      required: [id, taskId, authorId, authorName, body, parentCommentId, replyToCommentId, createdAt]

    ShareWriteRequest:
      type: object
      description: >
        Used by both `POST /boards/{id}/members` and `POST
        /tasks/{id}/shares` (US13/US14). `email` must belong to an
        already-registered user — see each operation's description for the
        404/idempotent-duplicate/self-share rules (US17).
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [viewer, collaborator]
      required: [email, role]

    ShareRoleWriteRequest:
      type: object
      description: Used by the role-change PATCH on both board_members and task_shares.
      properties:
        role:
          type: string
          enum: [viewer, collaborator]
      required: [role]

    PublicUserCompetency:
      type: object
      description: >
        One entry in a public profile's competency list (US-025/US-026) —
        deliberately a narrower shape than the caller's-own-profile
        `UserCompetency` schema: no `id`/`userId`/timestamps, since those
        have no meaning to a viewer who isn't the owner.
      properties:
        competencyId:
          type: string
          format: uuid
          nullable: true
          description: 'Null for a custom (`isCustom: true`) entry.'
        competencySlug:
          type: string
          nullable: true
          description: Locale key suffix (`competency.<slug>`); null for a custom entry.
        isCustom:
          type: boolean
        customLabel:
          type: string
          nullable: true
        willingToTeach:
          type: boolean
      required: [competencyId, competencySlug, isCustom, customLabel, willingToTeach]

    PublicUserSearchResult:
      type: object
      description: >
        One result row from `GET /users/search` (US-025 AC4). Only carries
        the `willing_to_teach = true` competencies (every entry here has
        `willingToTeach: true`) — contrast with `PublicUserProfile` below,
        which carries the FULL list. Never email/boards/time.
      properties:
        id:
          type: string
          description: Firebase UID
        name:
          type: string
          description: publicName if set, else displayName (AUTH-004 AC5/AC6 pattern).
        competencies:
          type: array
          items:
            $ref: '#/components/schemas/PublicUserCompetency'
      required: [id, name, competencies]

    PublicUserProfile:
      type: object
      description: >
        `GET /users/{id}` (US-026 AC1). The FULL `user_competencies` list
        (not just willing-to-teach ones, unlike PublicUserSearchResult) —
        each entry's own `willingToTeach` flag is what the FE renders the
        badge from. Never email/boards/time.
      properties:
        id:
          type: string
          description: Firebase UID
        name:
          type: string
          description: publicName if set, else displayName (AUTH-004 AC5/AC6 pattern).
        competencies:
          type: array
          items:
            $ref: '#/components/schemas/PublicUserCompetency'
      required: [id, name, competencies]

    DmThreadOtherUser:
      type: object
      properties:
        id:
          type: string
          description: Firebase UID of the OTHER participant (never the caller).
        name:
          type: string
          nullable: true

    DmThreadLastMessage:
      type: object
      nullable: true
      description: Null for a freshly-created thread with no messages yet (US-027 AC12).
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    DmThread:
      type: object
      description: A `dm_threads` row, hydrated for display (US-027 AC1/AC11).
      properties:
        id:
          type: string
          format: uuid
        competencyId:
          type: string
          format: uuid
        competencySlug:
          type: string
          nullable: true
        otherUser:
          $ref: '#/components/schemas/DmThreadOtherUser'
        lastMessage:
          $ref: '#/components/schemas/DmThreadLastMessage'
        createdAt:
          type: string
          format: date-time
      required: [id, competencyId, competencySlug, otherUser, lastMessage, createdAt]

    ChatMessageReplyPreview:
      type: object
      description: >
        US-035 AC5/AC6 — the hydrated quote a replying message carries, so
        the FE can render the quote block without a follow-up request for
        the original. `null` on a message that isn't a reply. Present
        identically on `GET .../messages` history and on the
        `dm.message.created`/`competencyChat.message.created` WS push.
      properties:
        id:
          type: string
          format: uuid
          description: The original (quoted) message's id — click-to-scroll target in the FE.
        authorName:
          type: string
          description: AUTH-004 AC5/AC6 publicName-falls-back-to-displayName of the quoted message's sender.
        excerpt:
          type: string
          description: First ~80 characters of the quoted message's body (plain slice, no ellipsis).
      required: [id, authorName, excerpt]

    ChatForwardSource:
      type: object
      description: >
        US-036 AC6 — attribution shown above a forwarded message's body:
        "Forwarded from {competency} chat". `null` unless this message was
        created by a forward FROM a competency chat room. NEVER populated
        from a DM source — forwarding a DM message is forbidden by design
        (US-036 AC2), so the original author is deliberately never exposed
        (the message's `senderId` is always the forwarder).
      properties:
        competencyId:
          type: string
          format: uuid
        competencySlug:
          type: string
          nullable: true
          description: Locale key `competency.<slug>` for the source room's display name.
      required: [competencyId, competencySlug]

    DmMessage:
      type: object
      description: >
        A `dm_messages` row (US-027/US-035/US-036). View + add only — no
        `updatedAt` (same MVP scope decision as `TaskComment`/`CompetencyChatMessage`).
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        senderId:
          type: string
          description: Firebase UID of the sender.
        senderName:
          type: string
          description: AUTH-004 AC5/AC6 publicName-falls-back-to-displayName pattern.
        body:
          type: string
          maxLength: 2000
        replyTo:
          allOf:
            - $ref: '#/components/schemas/ChatMessageReplyPreview'
          nullable: true
        forwardedFrom:
          allOf:
            - $ref: '#/components/schemas/ChatForwardSource'
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, threadId, senderId, senderName, body, replyTo, forwardedFrom, createdAt]

    CompetencyChatMessage:
      type: object
      description: >
        A `competency_chat_messages` row (US-028/US-035/US-036) — the shared
        room identified by `competencyId` (no separate "rooms" resource).
        View + add only, same MVP scope as `DmMessage`/`TaskComment`.
      properties:
        id:
          type: string
          format: uuid
        competencyId:
          type: string
          format: uuid
        senderId:
          type: string
          description: Firebase UID of the sender.
        senderName:
          type: string
          description: AUTH-004 AC5/AC6 publicName-falls-back-to-displayName pattern.
        body:
          type: string
          maxLength: 2000
        replyTo:
          allOf:
            - $ref: '#/components/schemas/ChatMessageReplyPreview'
          nullable: true
        forwardedFrom:
          allOf:
            - $ref: '#/components/schemas/ChatForwardSource'
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, competencyId, senderId, senderName, body, replyTo, forwardedFrom, createdAt]

    CompetencyChatMembership:
      type: object
      description: >
        A `competency_chat_members` row (US-031) — the response body of
        `POST /competencies/{id}/chat/members`. Deliberately minimal: the
        FE already knows which competency it just (un)joined, this just
        confirms the resulting state.
      properties:
        competencyId:
          type: string
          format: uuid
        joined:
          type: boolean
          description: Always `true` — a successful join, whether newly created (201) or already existing (200).
      required: [competencyId, joined]

    CompetencyChatSummary:
      type: object
      description: >
        One entry in `GET /competency-chats/mine` (US-031 AC5) — a
        competency chat the caller has explicitly joined. Mirrors
        `DmThread`'s shape: `joinedAt` plays the same "fallback activity
        timestamp when there's no message yet" role `DmThread.createdAt`
        plays for a thread with no messages (US-027 AC12) — the FE computes
        display "last activity" as `lastMessage?.createdAt ?? joinedAt`,
        same pattern as `DmThread`.
      properties:
        id:
          type: string
          format: uuid
          description: The `competency_chat_members` row id (membership id, not a message id).
        competencyId:
          type: string
          format: uuid
        competencySlug:
          type: string
          description: Locale lookup key — rendered via `competency.<slug>` in the FE's own dictionary.
        competencyActive:
          type: boolean
          description: >
            `false` if the competency has been deactivated since the caller
            joined (US-031 AC7) — the row still appears here (no cascade
            delete on retirement) but the FE renders it archived/disabled,
            with leave as the only available action (US-033 AC5).
        lastMessage:
          $ref: '#/components/schemas/DmThreadLastMessage'
        joinedAt:
          type: string
          format: date-time
      required: [id, competencyId, competencySlug, competencyActive, lastMessage, joinedAt]

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: AUTH_TOKEN_INVALID
            messageKey:
              type: string
              description: Localization key the FE looks up in its own locale dictionary.
              example: errors.auth.tokenInvalid
            message:
              type: string
              description: English fallback for logs/devtools — not shown to end users.
          required: [code, messageKey]
      required: [error]

security:
  - firebaseIdToken: []

# ---------------------------------------------------------------------------
# WebSocket channel (US-029) — documented here as plain text, NOT as an
# OpenAPI `paths` entry, since OpenAPI 3.0 has no syntax for a WS
# upgrade/frame protocol. This is the one deliberate, explicitly-documented
# departure from "every endpoint is a REST path in this file" (CLAUDE.md
# "Архітектура": the FE ↔ BE contract was pure REST before US-029).
#
# Placement decision (US-029 AC6/AC7): the WS server is attached to the
# SAME http.Server/port (4000) the Express app already listens on — see
# backend/src/ws/server.js's header comment for the full rationale and
# trade-offs. `docker-compose.yml` is therefore UNCHANGED by this pass;
# there is no new service to add.
#
# Endpoint:      ws(s)://<same host:port as the REST API>/ws?token=<Firebase ID token>
#
# Authentication (US-029 AC2/AC3): the SAME Firebase ID token used for
# `Authorization: Bearer` on REST calls, passed as the `token` query
# parameter (the browser's native WebSocket API can't set custom headers on
# the upgrade request). Verified via the same Firebase Admin SDK
# `verifyIdToken()` the REST `requireAuth` middleware uses — not a separate
# auth mechanism. A missing or invalid/expired token gets a structured
# `error` frame (`ws.error.unauthorized`) followed immediately by the
# server closing the connection with close code 4401 — no subscription or
# message is ever accepted first.
#
# Delivery guarantee (US-027 AC8/AC9, US-029 AC5/AC9): REST is unconditionally
# the source of truth. Every message is written to Postgres by a REST POST
# BEFORE any WS event is broadcast; a missing/dropped/never-subscribed WS
# connection never loses a message — the full history is always available
# via `GET /dm-threads/{id}/messages` / `GET /competencies/{id}/chat/messages`.
# WS only accelerates "live" delivery to connections that happen to be
# listening at that instant.
#
# --- Client -> Server frames ---
#
#   {"type": "subscribe", "channel": "dmThread", "threadId": "<uuid>"}
#     Authorized via the SAME service-layer check
#     (`requireDmThreadAccess`) `GET /dm-threads/{id}/messages` uses — only
#     the thread's two participants can subscribe. A non-participant OR a
#     nonexistent thread id get the identical denial (anti-enumeration,
#     same as the REST 403 — see that path's description).
#
#   {"type": "subscribe", "channel": "competencyChat", "competencyId": "<uuid>"}
#     Authorized via `requireActiveCompetencyRoom` — the same existence/
#     active check `GET /competencies/{id}/chat/messages` uses. Any
#     authenticated user may subscribe to any active room; a nonexistent or
#     retired (`is_active=false`) competency is denied.
#
#   {"type": "unsubscribe", "channel": "dmThread" | "competencyChat", "threadId"|"competencyId": "<uuid>"}
#     Mirrors subscribe; no authorization check needed to leave a channel.
#
# --- Server -> Client frames ---
#
#   {"type": "ready"}
#     Sent once, right after successful token verification — the signal
#     that subscribe/message frames may now be sent.
#
#   {"type": "subscribed", "channel": "dmThread"|"competencyChat", "threadId"|"competencyId": "<uuid>"}
#     Acknowledges a successful subscribe.
#
#   {"type": "error", "code": "UNAUTHORIZED", "messageKey": "ws.error.unauthorized"}
#     Connection-level auth failure (US-029 AC3) — always followed by the
#     server closing the connection (code 4401).
#
#   {"type": "error", "code": "FORBIDDEN", "messageKey": "ws.error.subscribeForbidden"}
#     A `subscribe` to a `dmThread` the caller isn't a participant of (or
#     that doesn't exist) was denied. Connection stays open.
#
#   {"type": "error", "code": "NOT_FOUND", "messageKey": "errors.competencyChat.notFound"}
#     A `subscribe` to a `competencyChat` room that's nonexistent or
#     retired was denied. Connection stays open. (Reuses the exact same
#     messageKey the REST 404 for this room uses — same content, no reason
#     for a separate WS-prefixed key here.)
#
#   {"type": "error", "code": "BAD_REQUEST", "messageKey": "ws.error.badRequest"}
#     A frame that isn't valid JSON, or has no recognized `type` — a
#     defensive addition beyond the BA-specified error keys, for a
#     malformed client frame that has no other natural error code.
#
#   {"type": "dm.message.created", "threadId": "<uuid>", "message": <DmMessage>}
#     Pushed to (a) any connection subscribed to this specific `dmThread`
#     channel (an open conversation screen, US-027 AC9) AND (b) EVERY live
#     connection belonging to either participant, regardless of whether
#     they've subscribed to this exact thread — this is "my own inbox"
#     delivery, always allowed since it's the caller's own data, and it's
#     what lets the my-threads list bump a thread to the top even when that
#     thread's screen isn't open (US-027 AC10).
#
#   {"type": "competencyChat.message.created", "competencyId": "<uuid>", "message": <CompetencyChatMessage>}
#     Pushed only to connections subscribed to that specific `competencyChat`
#     channel — a group room has no personal-inbox equivalent.
#
# `<DmMessage>`/`<CompetencyChatMessage>` above are the exact same JSON
# shapes as the `DmMessage`/`CompetencyChatMessage` schemas defined under
# `components.schemas` for the REST endpoints — the WS push is the identical
# object the matching POST endpoint just returned, not a separate shape.
# This includes the US-035 `replyTo` (`{id, authorName, excerpt}` or `null`)
# and US-036 `forwardedFrom` (`{competencyId, competencySlug}` or `null`)
# fields — both are already hydrated on the pushed object (US-035 AC5), so a
# live quote block / forward attribution renders with no follow-up request.
# A forward (`POST /chat/forwards`) emits the same `*.message.created` event
# for its destination chat as a normal send does.
#
# What FE needs to know to wire this up (frontend-developer, US-027/US-028):
#   - Connect once per session: `new WebSocket(`${WS_BASE_URL}/ws?token=${idToken}`)`.
#   - Wait for `{"type":"ready"}` before sending any `subscribe` frame.
#   - Re-send `subscribe` frames after any reconnect — subscriptions are
#     NOT remembered across a dropped connection.
#   - No `subscribe` is needed just to get my-threads-list bumps (US-027
#     AC10) — those arrive automatically to every authenticated connection
#     for that user. `subscribe` to `dmThread` is only needed to receive
#     live message pushes while a specific thread's screen is open.
#   - On any `error` frame, look up `messageKey` in the FE's own locale
#     dictionary (same convention as every REST error) — never render the
#     frame's `code` or a raw message to the user.
#   - Token refresh mid-connection is NOT handled by this pass — a token
#     that expires while a connection is open is not proactively
#     re-verified; reconnect (which the FE already needs for network drops,
#     `ws.status.reconnecting`) with a fresh token is the only refresh path
#     for now.
# ---------------------------------------------------------------------------
